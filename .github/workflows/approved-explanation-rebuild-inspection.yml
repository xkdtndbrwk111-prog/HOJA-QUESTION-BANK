name: Verify rebuilt HOJA explanation release
on:
  push:
    branches: [work/approved-explanation-rebuild-20261128]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: xkdtndbrwk111-prog/HOJA-QUESTION-BANK
          ref: 13f30c0c83591159c6879df216014c73d6469bfa
          path: qbank-runtime
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: xkdtndbrwk111-prog/HOJA-QUESTION-BANK
          ref: 3573717a8af4a224f62bf51061267da8ce73632d
          path: qbank-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: xkdtndbrwk111-prog/SMQ-Project-A
          ref: 6bb90c3bdf7a44822962b7ba36f6f5d41c7646b4
          path: smq
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild and verify new source and package pins
        run: |
          set -euo pipefail
          P=smq/experimental/usage-v4-unified/approved-catalog
          node "$P/build_approved_index.mjs" --qbank qbank-source
          node "$P/build_content_packages.mjs" --qbank qbank-source --packages-out "$RUNNER_TEMP/rebuilt"
          node --input-type=module <<'JS'
          import fs from 'node:fs';import crypto from 'node:crypto';import assert from 'node:assert/strict';
          const dir='smq/experimental/usage-v4-unified/approved-catalog/';
          const idx=JSON.parse(fs.readFileSync(dir+'generated/approved-source-index.json'));
          const report=JSON.parse(fs.readFileSync(dir+'generated/approved-content-report.json'));
          const ix='game-runtime/approved-packages/v1/INDEX.json';
          const p=JSON.parse(fs.readFileSync('qbank-runtime/'+ix));
          assert.deepEqual(p,JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/rebuilt/'+ix)));
          assert.equal(idx.approvalUnits,29);assert.equal(idx.approvalQuestions,899);
          const manifest=JSON.parse(fs.readFileSync(dir+'deployment/hoja15-remote-release.json'));
          const byId=new Map(idx.entries.map(e=>[e.cartridgeId,e]));
          assert.equal(manifest.entries.length,29);
          const units=p.packages.map(e=>{
            const b=fs.readFileSync('qbank-runtime/'+e.path);assert.equal(crypto.createHash('sha256').update(b).digest('hex'),e.sha256);assert.deepEqual(b,fs.readFileSync(process.env.RUNNER_TEMP+'/rebuilt/'+e.path));
            const d=JSON.parse(b);return {id:e.cartridgeId,payload:{questions:d.questions.map(q=>q.rendererQuestion),originalQuestions:d.questions.map(q=>q.originalQuestion),images:d.images,tags:d.tags,unitMeta:d.unitMeta}};
          });
          assert.equal(units.reduce((s,u)=>s+u.payload.questions.length,0),899);
          console.log('SOURCE_PIN_SET '+JSON.stringify({sourceCommit:idx.sourceCommit,entries:idx.entries.map(e=>({cartridgeId:e.cartridgeId,effectiveSha256:e.effectiveSha256,mediaRights:e.mediaRights.status,questions:e.questionCount}))}));
          fs.writeFileSync(process.env.RUNNER_TEMP+'/payloads.json',JSON.stringify(units));
          JS
          node smq/experimental/unified-quiz-renderer/compose_renderer.mjs "$RUNNER_TEMP/composed.html"
      - name: Run existing four-viewport render gate
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python3 smq/experimental/usage-v4-unified/verify_f1b_render.py "$RUNNER_TEMP/payloads.json" "$RUNNER_TEMP/composed.html"
