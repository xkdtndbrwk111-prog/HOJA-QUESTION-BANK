name: Check HOJA handoff checkpoint
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate recovery evidence
        run: python3 tools/verify_handoff.py
