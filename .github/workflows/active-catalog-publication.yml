name: HOJA active catalog publication gate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: Verify immutable catalog publication
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify using trusted base-branch validator
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet "$BASE" "$HEAD_SHA" -- game-runtime/active/v1/; then
            echo "No active catalog publication changes"; exit 0
          fi
          git show "$BASE:tools/verify_active_catalog_publication.py" > "$RUNNER_TEMP/verify_active_catalog.py"
          python3 "$RUNNER_TEMP/verify_active_catalog.py" "$BASE" "$HEAD_SHA"
