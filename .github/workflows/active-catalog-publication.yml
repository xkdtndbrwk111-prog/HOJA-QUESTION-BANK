name: HOJA active catalog publication gate
on:
  pull_request_target:
    branches: [main]
permissions:
  contents: read
  statuses: write
jobs:
  verify:
    name: Validate immutable catalog objects (trusted base)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      # Never execute PR code, checkout only the trusted base. No secrets.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable publication objects with base validator
        id: verify
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          if git diff --quiet "$BASE" "$HEAD_SHA" -- game-runtime/active/v1/; then
            echo "No active catalog publication changes"; exit 0
          fi
          python3 tools/verify_active_catalog_publication.py "$BASE" "$HEAD_SHA"
      - name: Report required status on the exact PR head commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RESULT: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          state=failure
          if [[ "$RESULT" == success ]]; then state=success; fi
          gh api --method POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context="Verify immutable catalog publication" \
            -f description="Trusted base validates immutable catalog objects" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
