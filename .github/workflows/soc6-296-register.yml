name: Restore missing approved social archive blobs
on:
  push:
    branches: [work/soc6-296-approved-20261128]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recreate and force-add exactly the approved five ZIP blobs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          test "$(git rev-parse origin/main)" = 1f9852242290f2a99cb5a2476df408e5cba3ec2f
          git worktree add --detach "$RUNNER_TEMP/reconstruct" fc232952d3b68166586769f61e9e7dad7223c8ed
          mkdir -p "$RUNNER_TEMP/reconstruct/workflow/soc6-296-input"
          cp workflow/soc6-296-input/*.js "$RUNNER_TEMP/reconstruct/workflow/soc6-296-input/"
          cp tools/register_soc6_296_20261128.py "$RUNNER_TEMP/reconstruct/tools/"
          (cd "$RUNNER_TEMP/reconstruct"; python3 tools/register_soc6_296_20261128.py)
          git worktree add --detach "$RUNNER_TEMP/qbank" origin/main
          cd "$RUNNER_TEMP/qbank"
          python3 - <<'PY'
          import pathlib,json,hashlib,os,subprocess
          root=pathlib.Path('approved/social/grade6/semester2')
          old=pathlib.Path(os.environ['RUNNER_TEMP'])/'reconstruct'
          count=0
          for p in sorted(root.glob('soc6-s2-u[12]-*/manifest.json')):
              m=json.loads(p.read_text());a=p.parent/m['archive']
              assert not a.exists()
              b=(old/a).read_bytes()
              assert hashlib.sha256(b).hexdigest()==m['archiveSha256'] and len(b)==m['archiveBytes'],str(a)
              a.write_bytes(b)
              subprocess.run(['git','add','-f','--',str(a)],check=True);count+=1
          assert count==5
          print('EXACT_MISSING_ARCHIVES_RESTORED',count)
          PY
          git diff --cached --stat
          git commit -m 'Restore five exact approved ZIP blobs excluded by gitignore'
          SOURCE=$(git rev-parse HEAD)
          git clone --no-tags https://github.com/xkdtndbrwk111-prog/SMQ-Project-A.git "$RUNNER_TEMP/smq"
          git -C "$RUNNER_TEMP/smq" checkout --detach fdf15cb2611c26053285e20d261a5847d81adcd5
          P="$RUNNER_TEMP/smq/experimental/usage-v4-unified/approved-catalog"
          node "$P/build_approved_index.mjs" --qbank "$PWD"
          node "$P/build_content_packages.mjs" --qbank "$PWD" --packages-out "$RUNNER_TEMP/packages"
          python3 - <<'PY'
          import json,pathlib,os,hashlib
          old=pathlib.Path('game-runtime/approved-packages/v1');new=pathlib.Path(os.environ['RUNNER_TEMP'])/'packages'/old
          a=json.loads((old/'INDEX.json').read_text());b=json.loads((new/'INDEX.json').read_text())
          assert len(a['packages'])==len(b['packages'])==34
          assert a['packages']==b['packages']
          total=0
          for e in b['packages']:
              p=pathlib.Path(e['path']).name
              assert (old/p).read_bytes()==(new/p).read_bytes()
              total+=len(json.loads((new/p).read_bytes())['questions'])
          assert total==1195
          print('ALL_34_RUNTIME_PACKAGE_BYTES_UNCHANGED',total)
          PY
          cp "$RUNNER_TEMP/packages/game-runtime/approved-packages/v1/INDEX.json" game-runtime/approved-packages/v1/INDEX.json
          git add game-runtime/approved-packages/v1/INDEX.json
          git commit -m 'Pin runtime index to source commit containing exact archive blobs'
          git push origin HEAD:refs/heads/work/soc6-296-archive-repair-20261128
          echo "SOURCE_COMMIT=$SOURCE RUNTIME_COMMIT=$(git rev-parse HEAD)"
