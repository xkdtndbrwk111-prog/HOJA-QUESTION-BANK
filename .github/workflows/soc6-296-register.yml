name: Verify 296 new social questions in the existing renderer
on:
  push:
    branches: [work/soc6-296-approved-20261128]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: xkdtndbrwk111-prog/HOJA-QUESTION-BANK
          ref: 71165739539fc3a4ce6e9c2cfad0963d40fde48e
          path: qbank-runtime
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: xkdtndbrwk111-prog/HOJA-QUESTION-BANK
          ref: 44397082fba88409ce7fd2ecec7c342a55046044
          path: qbank-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: xkdtndbrwk111-prog/SMQ-Project-A
          ref: fdf15cb2611c26053285e20d261a5847d81adcd5
          path: smq
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild exact source and runtime bytes and validate the new five units
        run: |
          set -euo pipefail
          P=smq/experimental/usage-v4-unified/approved-catalog
          node "$P/build_approved_index.mjs" --qbank qbank-source
          node "$P/build_content_packages.mjs" --qbank qbank-source --packages-out "$RUNNER_TEMP/rebuilt"
          node --input-type=module <<'JS'
          import fs from 'node:fs';import crypto from 'node:crypto';import assert from 'node:assert/strict';
          const dir='smq/experimental/usage-v4-unified/approved-catalog/';
          const idx=JSON.parse(fs.readFileSync(dir+'generated/approved-source-index.json'));
          const ix='game-runtime/approved-packages/v1/INDEX.json';
          const p=JSON.parse(fs.readFileSync('qbank-runtime/'+ix));
          assert.deepEqual(p,JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/rebuilt/'+ix)));
          assert.equal(idx.approvalUnits,34);assert.equal(idx.approvalQuestions,1195);
          let total=0;
          const units=p.packages.map(e=>{
            const b=fs.readFileSync('qbank-runtime/'+e.path);assert.equal(crypto.createHash('sha256').update(b).digest('hex'),e.sha256);assert.deepEqual(b,fs.readFileSync(process.env.RUNNER_TEMP+'/rebuilt/'+e.path));
            const d=JSON.parse(b);total+=d.questions.length;return {id:e.cartridgeId,payload:{questions:d.questions.map(q=>q.rendererQuestion),originalQuestions:d.questions.map(q=>q.originalQuestion),images:d.images,tags:d.tags,unitMeta:d.unitMeta}};
          }).filter(u=>/^soc6-s2-u[12]-/.test(u.id));
          assert.equal(total,1195);assert.equal(units.length,5);assert.equal(units.reduce((s,u)=>s+u.payload.questions.length,0),296);
          console.log('SOURCE_PIN_SET '+JSON.stringify({sourceCommit:idx.sourceCommit,entries:idx.entries.map(e=>({cartridgeId:e.cartridgeId,effectiveSha256:e.effectiveSha256,mediaRights:e.mediaRights.status,questions:e.questionCount,unitTitle:e.unitTitle}))}));
          fs.writeFileSync(process.env.RUNNER_TEMP+'/payloads.json',JSON.stringify(units));
          JS
          node smq/experimental/unified-quiz-renderer/compose_renderer.mjs "$RUNNER_TEMP/composed.html"
      - name: Render all new 296 questions at four viewports
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python3 smq/experimental/usage-v4-unified/verify_f1b_render.py "$RUNNER_TEMP/payloads.json" "$RUNNER_TEMP/composed.html"
